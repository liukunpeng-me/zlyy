version: "3"
networks:
  nocobase:
    driver: bridge
services:
  app:
    image: nocobase/nocobase:latest
    networks:
      - nocobase
    environment:
      - APP_KEY=your-secret-key # Replace it with your own app key
      - APP_CLIENT_ENTRY_MODE=modern-only
    volumes:
      - ./storage:/app/nocobase/storage
    ports:
      - "13000:80"